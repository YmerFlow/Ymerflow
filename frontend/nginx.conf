# :80 server — the app on plain HTTP, plus the ACME HTTP-01 webroot.
#
# This is the ONLY server baked into the image. When public TLS is off (PUBLIC_TLS
# unset) it serves the app exactly as before — byte-for-byte. When public TLS is on,
# 40-tls.sh (a) fills /tmp/tls-redirect.conf with a 301 so this server redirects the
# SPA to https once a cert exists, and (b) writes conf.d/tls.conf with the :443
# servers. The /.well-known/acme-challenge/ location below is always present so the
# certbot sidecar can complete HTTP-01 over this same :80 forward.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ACME HTTP-01 challenge webroot (shared emptyDir with the certbot sidecar).
    # Harmless when TLS is off: the directory is empty and unknown tokens 404.
    location /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
        try_files $uri =404;
    }

    include /etc/nginx/snippets/app-locations.conf;

    # SPA routing. /tmp/tls-redirect.conf is written by 40-tls.sh at container start:
    # empty (serve the SPA on :80) until a cert exists, then a
    #   `return 301 https://$host$request_uri;`
    # so http hits bounce to the :443 edge. Kept inside location / so /api, /ws, and
    # the ACME challenge above keep working on :80 either way.
    location / {
        include /tmp/tls-redirect.conf;
        try_files $uri $uri/ /index.html;
    }
}
