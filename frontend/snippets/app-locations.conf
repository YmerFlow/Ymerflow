# Shared reverse-proxy locations for the YmerFlow SPA host.
#
# Included by every server that serves the app itself — the baked :80 server
# (conf.d/default.conf) and, when public TLS is on, the generated :443 app server
# (conf.d/tls.conf, written by 40-tls.sh). Keeping these in one file means the http
# and https app servers can never drift. Do NOT put `listen`, `root`, `index`, the
# ACME location, or `location /` here — those are server-specific and live in the
# including server block.

# WebSocket proxy (must come before /api/ since /ws/ is not under /api/)
location /ws/ {
    proxy_pass http://backend-service:8000/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}

# MCP SSE connection: must come before /api/ to get proxy_buffering off.
# The initial SSE GET goes to /api/mcp; without buffering disabled here nginx
# would swallow the endpoint event and the client would never complete init.
location /api/mcp {
    proxy_pass http://backend-service:8000/mcp;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    proxy_buffering off;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
}

# REST API proxy: strip /api prefix before forwarding to backend
location /api/ {
    proxy_pass http://backend-service:8000/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    client_max_body_size 500m;
    proxy_request_buffering off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
}

# pgAdmin — proxied at /pgadmin/ with basic auth
# proxy_pass trailing slash strips the /pgadmin prefix before forwarding,
# so pgAdmin receives plain paths (/login, /static/…).
# X-Script-Name tells pgAdmin's middleware to prepend /pgadmin to all
# generated URLs so links and redirects stay under /pgadmin/.
# proxy_hide_header WWW-Authenticate prevents pgAdmin's own 401 responses
# from triggering the browser's basic-auth dialog on top of nginx's auth.
location /pgadmin/ {
    auth_basic "YmerFlow Admin";
    auth_basic_user_file /etc/nginx/htpasswd/admin.htpasswd;
    proxy_pass http://pgadmin.ymerflow.svc.cluster.local:80/;
    proxy_set_header X-Script-Name /pgadmin;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header WWW-Authenticate;
    proxy_read_timeout 300s;
}

# Headlamp (Kubernetes dashboard) — proxied at /headlamp/ with basic auth
# Headlamp is started with --base-url /headlamp so it generates correct URLs;
# WebSocket upgrade headers are included for live resource updates.
# 30-headlamp-token.sh (run at container start) writes /tmp/headlamp-token.conf
# with a proxy_set_header directive that injects the SA token so Headlamp
# auto-authenticates without requiring a manual token paste.
# proxy_hide_header WWW-Authenticate prevents Headlamp's own 401 responses
# from triggering the browser's basic-auth dialog on top of nginx's auth.
location /headlamp/ {
    auth_basic "YmerFlow Admin";
    auth_basic_user_file /etc/nginx/htpasswd/admin.htpasswd;
    include /tmp/headlamp-token.conf;
    proxy_pass http://headlamp.headlamp.svc.cluster.local:4466;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_hide_header WWW-Authenticate;
    proxy_read_timeout 3600s;
    proxy_buffering off;
}
