apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: ymerflow
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: backend
# NOTE: there used to be a second `backend-service` ExternalName Service in the ymerflow-jobs
# namespace so same-cluster job pods could reach the backend by that in-cluster name. It was
# removed: job pods now reach the backend via the public app origin + /api (job_orchestrator.py's
# BACKEND_URL), which works uniformly from local AND remote (AKS/GKE) clusters — the in-cluster
# ExternalName could never resolve on a remote cluster anyway.
